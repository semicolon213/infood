# WBS 1.1 — PR·병합마다 공통 DoD(lint·typecheck·test)와 DB 테스트(DB-01~17)를 실행한다.
# AI는 실제 모델을 호출하지 않는다 (AI_MOCK=1, vitest.config.mts). E2E(Playwright)는 주간 점검에서 따로 돌린다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package.json의 packageManager 버전을 그대로 쓴다
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 인증(gotrue)·REST(postgrest)·게이트웨이(kong)·DB만 띄운다. 마이그레이션과 시드가 적용된다
      - name: Start local Supabase
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export Supabase env
        run: |
          pnpm exec supabase status -o json > /tmp/sb.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_URL=$(jq -r .API_URL /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_ANON_KEY=$(jq -r .ANON_KEY /tmp/sb.json)" >> "$GITHUB_ENV"

      # 단위·통합·DB 테스트. CI에서는 DB 테스트를 건너뛰지 않는다 (db.test.ts)
      - name: Test
        run: pnpm test

      # 스키마를 바꾸고 타입을 다시 만들지 않았으면 실패 (AGENTS 규칙 15)
      - name: Check generated DB types
        run: |
          pnpm exec supabase gen types typescript > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts

      - name: Build
        run: pnpm build

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
