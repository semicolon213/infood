<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판매 마감 — FEFO 차감 · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f7f5;   /* stone paper */
      --color-ink:     #18181b;   /* zinc-900 */
      --color-muted:   #52525b;   /* zinc-600 */
      --color-accent:  #15803d;   /* green-700 */
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · 06_ARCHITECTURE 5.3</p>
    <h1>판매 마감 — FEFO 차감</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-sales-fefo-title seq-sales-fefo-desc">
        <title id="seq-sales-fefo-title">판매 마감 — FEFO 차감</title>
        <desc id="seq-sales-fefo-desc">브라우저가 판매 마감을 저장하면 서버가 묶음을 조회하고 FEFO 순수 함수로 차감 계획을 세운 뒤, Postgres RPC로 판매·차감·이력을 한 트랜잭션에 반영한다. 계획 후 잔량이 바뀌면 1회 다시 계획하고, 이미 마감한 날짜면 CONFLICT로 거부하며, 성공하면 결과와 부족 재료를 돌려준다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15803d"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f7f5"/>

        <!-- ALT fragment: 브라우저·서버 lifeline (x 136–680, y 420–596) -->
        <rect x="136" y="420" width="544" height="176" rx="4" fill="rgba(24,24,27,0.02)" stroke="rgba(24,24,27,0.22)" stroke-width="1"/>
        <rect x="136" y="420" width="40" height="16" rx="2" fill="#f7f7f5" stroke="rgba(24,24,27,0.22)" stroke-width="1"/>
        <text x="156" y="432" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <line x1="144" y1="512" x2="672" y2="512" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Lifelines: 브라우저 160 · 서버 480 · fefo 800 · Postgres 1120 -->
        <line x1="160" y1="104" x2="160" y2="640" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="104" x2="480" y2="640" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="104" x2="800" y2="640" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1120" y1="104" x2="1120" y2="640" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="476" y="152" width="8" height="476" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>
        <rect x="796" y="280" width="8" height="48" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>
        <rect x="1116" y="216" width="8" height="24" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>
        <rect x="1116" y="408" width="8" height="24" fill="rgba(24,24,27,0.06)" stroke="#52525b" stroke-width="0.8"/>

        <!-- M1 브라우저 → 서버: Server Action -->
        <line x1="160" y1="152" x2="476" y2="152" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="200" y="112" width="240" height="32" rx="2" fill="#f7f7f5"/>
        <text x="320" y="128" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">판매 마감 저장</text>
        <text x="320" y="140" fill="#1d4ed8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">recordDailySales(soldOn, [{menuId, qty}])</text>

        <!-- M2 서버 → Postgres: 조회 (경과 제외) -->
        <line x1="484" y1="216" x2="1116" y2="216" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="508" y="172" width="264" height="36" rx="2" fill="#f7f7f5"/>
        <text x="640" y="188" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">레시피·사용 가능 묶음 조회</text>
        <text x="640" y="204" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">잔량&gt;0, 판매일 기준 경과 제외 (BR-02)</text>

        <!-- M3 서버 → fefo: 계획 -->
        <line x1="484" y1="280" x2="796" y2="280" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="564" y="240" width="152" height="32" rx="2" fill="#f7f7f5"/>
        <text x="640" y="256" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">판매일 기준 FEFO 계획</text>
        <text x="640" y="268" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">planConsumption()</text>

        <!-- M4 fefo → 서버: 반환 -->
        <line x1="796" y1="328" x2="486" y2="328" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="584" y="288" width="112" height="32" rx="2" fill="#f7f7f5"/>
        <text x="640" y="304" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">차감 계획·부족분</text>
        <text x="640" y="316" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">[{lotId, qty}]</text>

        <!-- M5 서버 → Postgres: RPC (headline) -->
        <line x1="484" y1="408" x2="1116" y2="408" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="528" y="344" width="224" height="56" rx="2" fill="#f7f7f5"/>
        <text x="640" y="360" fill="#15803d" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">판매·차감·이력 한 트랜잭션</text>
        <text x="640" y="376" fill="#15803d" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">묶음 잠금(FOR UPDATE)·잔량 재검증</text>
        <text x="640" y="392" fill="#15803d" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rpc record_daily_sales()</text>

        <!-- ALT 영역 1: STOCK_CONFLICT → 서버가 다시 계획 -->
        <rect x="146" y="432" width="216" height="16" rx="2" fill="#f2f2f0"/>
        <text x="148" y="444" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">[STOCK_CONFLICT]</text>
        <text x="236" y="446" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">계획 후 잔량이 바뀜</text>
        <path d="M484 468 H512 Q520 468 520 476 V484 Q520 492 512 492 H486" fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="528" y="460" width="136" height="36" rx="2" fill="#f2f2f0"/>
        <text x="532" y="474" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">최신 재고로 다시 계획</text>
        <text x="532" y="490" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">(1회 재시도)</text>

        <!-- ALT 영역 2: 이미 마감한 날짜 → CONFLICT -->
        <rect x="146" y="516" width="168" height="16" rx="2" fill="#f2f2f0"/>
        <text x="148" y="528" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">[CONFLICT]</text>
        <text x="202" y="530" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">이미 마감한 날짜</text>
        <line x1="476" y1="580" x2="164" y2="580" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="220" y="540" width="200" height="32" rx="2" fill="#f2f2f0"/>
        <text x="320" y="552" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">이미 마감한 날짜예요</text>
        <text x="320" y="568" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">(재입력 FR-USE-06은 확장)</text>

        <!-- M7 서버 → 브라우저: 결과 -->
        <line x1="476" y1="628" x2="164" y2="628" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="256" y="604" width="128" height="16" rx="2" fill="#f7f7f5"/>
        <text x="320" y="616" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">결과·부족 재료 경고</text>

        <!-- Participants (drawn after arrows) -->
        <!-- 브라우저 (input) -->
        <rect x="72" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="72" y="40" width="176" height="64" rx="6" fill="rgba(82,82,91,0.10)" stroke="#63636b" stroke-width="1"/>
        <rect x="80" y="48" width="48" height="12" rx="2" fill="none" stroke="rgba(99,99,107,0.40)" stroke-width="0.8"/>
        <text x="104" y="57" fill="#63636b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="160" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">브라우저</text>
        <text x="160" y="96" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/sales</text>

        <!-- Next.js 서버 (backend) -->
        <rect x="392" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="392" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="400" y="48" width="48" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.30)" stroke-width="0.8"/>
        <text x="424" y="57" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
        <text x="480" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Next.js 서버</text>
        <text x="480" y="96" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Server Action</text>

        <!-- lib/stock/fefo (backend, pure function) -->
        <rect x="712" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="712" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="720" y="48" width="32" height="12" rx="2" fill="none" stroke="rgba(24,24,27,0.30)" stroke-width="0.8"/>
        <text x="736" y="57" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
        <text x="800" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">lib/stock/fefo</text>
        <text x="800" y="97" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">순수 함수</text>

        <!-- Postgres (store) -->
        <rect x="1032" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="1032" y="40" width="176" height="64" rx="6" fill="rgba(24,24,27,0.05)" stroke="#52525b" stroke-width="1"/>
        <rect x="1040" y="48" width="24" height="12" rx="2" fill="none" stroke="rgba(82,82,91,0.40)" stroke-width="0.8"/>
        <text x="1052" y="57" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="1120" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Postgres</text>
        <text x="1120" y="96" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Supabase</text>

        <!-- Legend -->
        <line x1="72" y1="664" x2="1208" y2="664" stroke="rgba(24,24,27,0.10)" stroke-width="0.8"/>
        <text x="72" y="680" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="72" y1="700" x2="100" y2="700" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="108" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">재고 반영 (핵심)</text>

        <line x1="248" y1="700" x2="276" y2="700" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="284" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Server Action 호출</text>

        <line x1="432" y1="700" x2="460" y2="700" stroke="#52525b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="468" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">함수·DB 호출</text>

        <line x1="584" y1="700" x2="612" y2="700" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="620" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">반환</text>

        <rect x="680" y="690" width="32" height="18" rx="2" fill="rgba(24,24,27,0.02)" stroke="rgba(24,24,27,0.22)" stroke-width="1"/>
        <text x="696" y="702" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ALT</text>
        <text x="720" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">분기 (둘 중 하나)</text>
      </svg>
    </div>
  </div>
</body>
</html>
