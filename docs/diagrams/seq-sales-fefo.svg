<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-sales-fefo-title seq-sales-fefo-desc" id="seq-sales-fefo-root">
        <title id="seq-sales-fefo-title">판매 마감 — FEFO 차감</title>
        <desc id="seq-sales-fefo-desc">브라우저가 판매 마감을 저장하면 서버가 묶음을 조회하고 FEFO 순수 함수로 차감 계획을 세운 뒤, Postgres RPC로 기존 차감 되돌리기와 새 차감을 한 번에 반영하고, 동시 변경 충돌 시 최대 1회 다시 계획한 다음 결과와 부족 재료를 돌려준다.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #seq-sales-fefo-root { --color-paper:   #f7f7f5;   
      --color-ink:     #18181b;   
      --color-muted:   #52525b;   
      --color-accent:  #15803d;   
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #seq-sales-fefo-root { font-family: var(--font-sans); color: var(--color-ink); }
      #seq-sales-fefo-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#seq-sales-fefo-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="seq-sales-fefo-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#52525b"/></marker>
          <marker id="seq-sales-fefo-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#15803d"/></marker>
          <marker id="seq-sales-fefo-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7f7f5"/>

        <!-- OPT fragment: server lifeline only (x 420–700, y 464–568) -->
        <rect x="420" y="464" width="280" height="104" rx="4" fill="#18181b" stroke="#18181b" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <rect x="420" y="464" width="40" height="16" rx="2" fill="#f7f7f5" stroke="#18181b" stroke-width="1" stroke-opacity="0.22"/>
        <text x="440" y="476" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="432" y="496" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[STOCK_CONFLICT]</text>

        <!-- Lifelines: 브라우저 160 · 서버 480 · fefo 800 · Postgres 1120 -->
        <line x1="160" y1="104" x2="160" y2="636" stroke="#18181b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="480" y1="104" x2="480" y2="636" stroke="#18181b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="800" y1="104" x2="800" y2="636" stroke="#18181b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="1120" y1="104" x2="1120" y2="636" stroke="#18181b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Activation bars -->
        <rect x="476" y="160" width="8" height="456" fill="#18181b" stroke="#52525b" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="796" y="296" width="8" height="56" fill="#18181b" stroke="#52525b" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="1116" y="232" width="8" height="24" fill="#18181b" stroke="#52525b" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="1116" y="440" width="8" height="24" fill="#18181b" stroke="#52525b" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- M1 브라우저 → 서버: Server Action -->
        <line x1="160" y1="160" x2="476" y2="160" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#seq-sales-fefo-arrow-link)"/>
        <rect x="200" y="120" width="240" height="32" rx="2" fill="#f7f7f5"/>
        <text x="320" y="136" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">판매 마감 저장</text>
        <text x="320" y="148" fill="#1d4ed8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">recordDailySales(soldOn, [{menuId, qty}])</text>

        <!-- M2 서버 → Postgres: 조회 -->
        <line x1="484" y1="232" x2="1116" y2="232" stroke="#52525b" stroke-width="1.2" marker-end="url(#seq-sales-fefo-arrow)"/>
        <rect x="560" y="188" width="160" height="36" rx="2" fill="#f7f7f5"/>
        <text x="640" y="204" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">레시피·잔량&gt;0 묶음 조회</text>
        <text x="640" y="220" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">같은 날짜 기존 차감량</text>

        <!-- M3 서버 → fefo: 계획 -->
        <line x1="484" y1="296" x2="796" y2="296" stroke="#52525b" stroke-width="1.2" marker-end="url(#seq-sales-fefo-arrow)"/>
        <rect x="544" y="256" width="192" height="32" rx="2" fill="#f7f7f5"/>
        <text x="640" y="272" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">기존 차감 되돌린 묶음으로 계획</text>
        <text x="640" y="284" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">planConsumption()</text>

        <!-- M4 fefo → 서버: 반환 -->
        <line x1="796" y1="352" x2="486" y2="352" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-sales-fefo-arrow)"/>
        <rect x="584" y="312" width="112" height="32" rx="2" fill="#f7f7f5"/>
        <text x="640" y="328" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">차감 계획·부족분</text>
        <text x="640" y="340" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">[{lotId, qty}]</text>

        <!-- M5 서버 → Postgres: RPC (headline) -->
        <line x1="484" y1="440" x2="1116" y2="440" stroke="#15803d" stroke-width="1.4" marker-end="url(#seq-sales-fefo-arrow-accent)"/>
        <rect x="532" y="384" width="216" height="48" rx="2" fill="#f7f7f5"/>
        <text x="640" y="400" fill="#15803d" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">기존 차감 되돌리기 + 새 차감</text>
        <text x="640" y="416" fill="#15803d" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">묶음 잠금·잔량 재검증</text>
        <text x="640" y="428" fill="#15803d" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rpc record_daily_sales() · FOR UPDATE</text>

        <!-- M6 서버 self: 다시 계획 (inside OPT) -->
        <path d="M484 512 H512 Q520 512 520 520 V528 Q520 536 512 536 H486" fill="none" stroke="#52525b" stroke-width="1.2" marker-end="url(#seq-sales-fefo-arrow)"/>
        <rect x="528" y="508" width="140" height="36" rx="2" fill="#f7f7f5"/>
        <text x="532" y="522" fill="#18181b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">최신 상태로 다시 계획</text>
        <text x="532" y="538" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">(최대 1회 재시도)</text>

        <!-- M7 서버 → 브라우저: 결과 -->
        <line x1="476" y1="616" x2="164" y2="616" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-sales-fefo-arrow)"/>
        <rect x="256" y="592" width="128" height="16" rx="2" fill="#f7f7f5"/>
        <text x="320" y="604" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">결과·부족 재료 경고</text>

        <!-- Participants (drawn after arrows) -->
        <!-- 브라우저 (input) -->
        <rect x="72" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="72" y="40" width="176" height="64" rx="6" fill="#52525b" stroke="#63636b" stroke-width="1" fill-opacity="0.10"/>
        <rect x="80" y="48" width="48" height="12" rx="2" fill="none" stroke="#63636b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="104" y="57" fill="#63636b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="160" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">브라우저</text>
        <text x="160" y="96" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/sales</text>

        <!-- Next.js 서버 (backend) -->
        <rect x="392" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="392" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="400" y="48" width="48" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="424" y="57" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
        <text x="480" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Next.js 서버</text>
        <text x="480" y="96" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Server Action</text>

        <!-- lib/stock/fefo (backend, pure function) -->
        <rect x="712" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="712" y="40" width="176" height="64" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
        <rect x="720" y="48" width="32" height="12" rx="2" fill="none" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="736" y="57" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
        <text x="800" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">lib/stock/fefo</text>
        <text x="800" y="97" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">순수 함수</text>

        <!-- Postgres (store) -->
        <rect x="1032" y="40" width="176" height="64" rx="6" fill="#f7f7f5"/>
        <rect x="1032" y="40" width="176" height="64" rx="6" fill="#18181b" stroke="#52525b" stroke-width="1" fill-opacity="0.05"/>
        <rect x="1040" y="48" width="24" height="12" rx="2" fill="none" stroke="#52525b" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="1052" y="57" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="1120" y="80" fill="#18181b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">Postgres</text>
        <text x="1120" y="96" fill="#52525b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Supabase</text>

        <!-- Legend -->
        <line x1="72" y1="664" x2="1208" y2="664" stroke="#18181b" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="72" y="680" fill="#52525b" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="72" y1="700" x2="100" y2="700" stroke="#15803d" stroke-width="1.4" marker-end="url(#seq-sales-fefo-arrow-accent)"/>
        <text x="108" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">재고 반영 (핵심)</text>

        <line x1="248" y1="700" x2="276" y2="700" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#seq-sales-fefo-arrow-link)"/>
        <text x="284" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">Server Action 호출</text>

        <line x1="432" y1="700" x2="460" y2="700" stroke="#52525b" stroke-width="1.2" marker-end="url(#seq-sales-fefo-arrow)"/>
        <text x="468" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">함수·DB 호출</text>

        <line x1="584" y1="700" x2="612" y2="700" stroke="#52525b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#seq-sales-fefo-arrow)"/>
        <text x="620" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">반환</text>

        <rect x="680" y="690" width="32" height="18" rx="2" fill="#18181b" stroke="#18181b" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.22"/>
        <text x="696" y="702" fill="#52525b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
        <text x="720" y="704" fill="#52525b" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">조건부 구간</text>
